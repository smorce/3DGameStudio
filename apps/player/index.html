<!doctype html>
<html lang="ja">
  <head>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23365b4e'/%3E%3Ctext x='6' y='23' fill='%23ffe4a0' font-size='26'%3Em%3C/text%3E%3C/svg%3E"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Machine Studio Player</title>
  </head>
  <body style="margin: 0">
    <canvas style="width: 100vw; height: 100vh; display: block"></canvas>
    <div
      style="position: absolute; top: 15px; left: 15px; font-family: sans-serif"
    >
      <button id="play">▶ あそぶ</button
      ><input id="file" type="file" accept=".json" /><span id="status"
        >WASD：運転 / Space：ブレーキ</span
      >
    </div>
    <output
      id="speed-hud"
      aria-label="Speed"
      hidden
      style="
        position: absolute;
        top: 15px;
        right: 15px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 1px;
        min-width: 96px;
        padding: 8px 14px;
        border: 1px solid #dce1d8;
        border-radius: 12px;
        background: #fffdf2e6;
        color: #263f3d;
        box-shadow: 0 4px 16px #32443814;
        font: 700 20px 'Noto Sans JP', sans-serif;
        pointer-events: none;
      "
    >
      <span style="font-size: 9px; letter-spacing: 0.14em; color: #60776e"
        >SPEED</span
      >
      <strong
        id="speed-hud-value"
        style="display: flex; align-items: baseline; gap: 4px; line-height: 1.15"
        >0<span style="font-size: 11px; color: #60776e"> km/h</span></strong
      >
    </output>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
